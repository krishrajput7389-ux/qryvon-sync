<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qryvon Sync | Gate Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #0A1F18; overflow-x: hidden; }
    
    /* Sci-Fi Scanning Laser Animation */
    .scan-container { position: relative; overflow: hidden; border-radius: 1rem; }
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #34D399; /* Emerald 400 */
      box-shadow: 0 0 15px 5px rgba(52, 211, 153, 0.5);
      animation: scan 2s infinite linear;
      z-index: 10;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Override default video styles for a cleaner look */
    #reader video {
      object-fit: cover !important;
      border-radius: 1rem;
      width: 100% !important;
    }
    
    .glass-panel {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(196, 181, 253, 0.2);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen font-sans flex flex-col items-center py-6 px-4">

  <!-- Header -->
  <div class="w-full max-w-md flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-wider">GATE <span class="text-[#FFD700]">SCANNER</span></h1>
      <p class="text-xs text-[#C4B5FD] font-mono mt-1">SYSTEM ONLINE</p>
    </div>
    <a href="/admin.html" class="bg-black/50 border border-[#C4B5FD]/30 text-[#C4B5FD] hover:bg-[#C4B5FD]/20 px-3 py-1.5 rounded-lg text-xs font-bold transition">Dashboard</a>
  </div>

  <!-- Main Scanner HUD -->
  <div class="w-full max-w-md glass-panel rounded-2xl p-4 shadow-2xl relative">
    
    <!-- Camera Viewfinder -->
    <div class="scan-container border-2 border-[#C4B5FD]/30 bg-black aspect-square w-full shadow-[0_0_30px_rgba(10,31,24,0.8)] flex items-center justify-center relative">
      <div id="reader" class="w-full h-full rounded-2xl overflow-hidden"></div>
      <div class="scan-laser" id="laserLine"></div>
      
      <!-- Targeting Corners -->
      <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-[#FFD700] rounded-tl z-10"></div>
      <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-[#FFD700] rounded-tr z-10"></div>
      <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-[#FFD700] rounded-bl z-10"></div>
      <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-[#FFD700] rounded-br z-10"></div>
    </div>

    <!-- Controls -->
    <div class="mt-4 flex justify-between items-center gap-4">
      <button onclick="toggleCamera()" class="flex-1 bg-black/60 border border-[#C4B5FD]/40 text-[#C4B5FD] hover:bg-[#C4B5FD]/20 py-3 rounded-xl text-sm font-bold transition flex justify-center items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
        </svg>
        Flip Camera
      </button>
      <button onclick="document.getElementById('manualCodeDiv').classList.toggle('hidden')" class="bg-black/60 border border-slate-500 text-slate-300 hover:bg-slate-800 py-3 px-4 rounded-xl text-sm font-bold transition">
        Manual Entry
      </button>
    </div>

    <!-- Manual Entry Hidden Div -->
    <div id="manualCodeDiv" class="hidden mt-4 flex gap-2">
      <input type="text" id="manualTicketInput" placeholder="SYNC-XXXXXX" class="flex-1 bg-black/80 border border-[#FFD700]/50 rounded-lg px-3 py-2 text-white font-mono uppercase focus:outline-none focus:border-[#FFD700]">
      <button onclick="submitManual()" class="bg-[#FFD700] text-[#0A1F18] font-bold px-4 py-2 rounded-lg hover:bg-yellow-500">Verify</button>
    </div>
  </div>

  <!-- Status Result Card -->
  <div id="statusBox" class="w-full max-w-md mt-4 rounded-xl p-5 shadow-2xl transition-all duration-300 opacity-0 translate-y-4 hidden">
    <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-3">
      <h2 id="statusHeading" class="text-xl font-black uppercase tracking-widest">--</h2>
      <p id="statusMessage" class="text-xs font-bold text-white/70">--</p>
    </div>
    
    <div id="ticketDetails" class="hidden flex-col gap-2">
      <div class="flex justify-between items-center bg-black/40 p-2 rounded-lg border border-white/5">
        <span class="text-[10px] text-[#C4B5FD] uppercase font-bold">Ticket ID</span>
        <span id="tId" class="font-mono font-bold text-[#FFD700]">--</span>
      </div>
      <div class="flex justify-between items-center bg-black/40 p-2 rounded-lg border border-white/5">
        <span class="text-[10px] text-[#C4B5FD] uppercase font-bold">Participant</span>
        <span id="tName" class="font-bold text-white text-sm">--</span>
      </div>
      <div class="flex justify-between items-center bg-black/40 p-2 rounded-lg border border-white/5">
        <span class="text-[10px] text-[#C4B5FD] uppercase font-bold">Team</span>
        <span id="tTeam" class="font-bold text-white text-sm">--</span>
      </div>
      <div id="projectLinks" class="flex justify-between mt-2 pt-2 border-t border-white/10">
        <!-- Links Injected Here -->
      </div>
    </div>
  </div>

  <script>
    const token = () => localStorage.getItem('qryvon_admin_token');
    if (!token()) {
      alert("Unauthorized! Redirecting to login...");
      window.location.href = '/admin.html';
    }

    let html5QrCode;
    let isFrontCamera = false;
    let isProcessing = false;

    // Initialize custom scanner
    async function initScanner() {
      html5QrCode = new Html5Qrcode("reader");
      startCamera();
    }

    function startCamera() {
      const facingMode = isFrontCamera ? "user" : "environment";
      document.getElementById('laserLine').style.display = 'block';
      
      html5QrCode.start(
        { facingMode: facingMode },
        { fps: 15, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        (errorMessage) => { /* Ignore frame errors */ }
      ).catch(err => {
        console.warn("Camera start failed:", err);
      });
    }

    async function toggleCamera() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      isFrontCamera = !isFrontCamera;
      startCamera();
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      verifyTicket(decodedText);
    }

    function submitManual() {
      const val = document.getElementById('manualTicketInput').value.trim().toUpperCase();
      if (val) verifyTicket(val);
    }

    async function verifyTicket(ticket_id) {
      isProcessing = true;
      document.getElementById('laserLine').style.display = 'none'; // Pause animation
      
      const statusBox = document.getElementById('statusBox');
      const sHeading = document.getElementById('statusHeading');
      const sMessage = document.getElementById('statusMessage');
      const tDetails = document.getElementById('ticketDetails');
      
      // Reset Box Style
      statusBox.classList.remove('hidden', 'opacity-0', 'translate-y-4');
      statusBox.className = "w-full max-w-md mt-4 rounded-xl p-5 shadow-2xl transition-all duration-300 glass-panel";
      sHeading.textContent = "Verifying...";
      sMessage.textContent = "";
      tDetails.classList.add('hidden');

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token()}`
          },
          body: JSON.stringify({ ticket_id })
        });
        
        const data = await res.json();

        // Reveal Details Div if attendee exists
        if (data.attendee) {
          tDetails.classList.remove('hidden');
          document.getElementById('tId').textContent = data.attendee.ticket_id;
          document.getElementById('tName').textContent = data.attendee.full_name;
          document.getElementById('tTeam').textContent = data.attendee.team_size === 'solo' ? 'Solo' : data.attendee.team_name;
          
          document.getElementById('projectLinks').innerHTML = `
            ${data.attendee.github_link ? `<a href="${data.attendee.github_link}" target="_blank" class="text-xs text-sky-400 font-bold hover:underline">GitHub ↗</a>` : '<span class="text-xs text-white/40">No GitHub</span>'}
            ${data.attendee.itchio_link ? `<a href="${data.attendee.itchio_link}" target="_blank" class="text-xs text-red-400 font-bold hover:underline">Itch.io ↗</a>` : '<span class="text-xs text-white/40">No Itch</span>'}
          `;
        } else {
          tDetails.classList.add('hidden');
        }

        // Apply Status Colors
        if (data.status === 'VALID') {
          statusBox.classList.add('border-emerald-500', 'bg-emerald-900/40');
          sHeading.className = "text-xl font-black uppercase tracking-widest text-emerald-400";
          sHeading.textContent = "ACCESS GRANTED";
          sMessage.textContent = "Checked in successfully!";
        } 
        else if (data.status === 'ALREADY_USED') {
          statusBox.classList.add('border-amber-500', 'bg-amber-900/40');
          sHeading.className = "text-xl font-black uppercase tracking-widest text-amber-400";
          sHeading.textContent = "ALREADY CHECKED IN";
          sMessage.textContent = `At ${data.checked_in_at}`;
        }
        else {
          statusBox.classList.add('border-red-500', 'bg-red-900/40');
          sHeading.className = "text-xl font-black uppercase tracking-widest text-red-400";
          sHeading.textContent = "INVALID TICKET";
          sMessage.textContent = data.message || "Does not exist in database.";
        }

      } catch (err) {
        statusBox.classList.add('border-red-500', 'bg-red-900/40');
        sHeading.className = "text-xl font-black uppercase tracking-widest text-red-400";
        sHeading.textContent = "NETWORK ERROR";
      }

      // Allow next scan after 3 seconds
      setTimeout(() => {
        document.getElementById('laserLine').style.display = 'block';
        statusBox.classList.add('opacity-0', 'translate-y-4');
        setTimeout(() => statusBox.classList.add('hidden'), 300); // Wait for fade out
        document.getElementById('manualTicketInput').value = '';
        isProcessing = false;
      }, 3500);
    }

    // Start on load
    initScanner();
  </script>
</body>
</html>
