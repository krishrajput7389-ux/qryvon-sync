<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qryvon Sync | Judging Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-qryvon-dark { background-color: #0A1F18; }
  </style>
</head>
<body class="bg-qryvon-dark text-slate-100 min-h-screen font-sans pb-20">

  <div id="loginScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-qryvon-dark px-4 hidden">
    <div class="text-center">
      <h2 class="text-xl font-bold text-white mb-4">Admin Access Required</h2>
      <a href="/admin.html" class="bg-[#FFD700] text-[#0A1F18] font-bold py-2 px-6 rounded-lg text-sm hover:bg-yellow-500 transition">Go to Login</a>
    </div>
  </div>

  <div id="judgingScreen" class="p-6 max-w-[1200px] mx-auto space-y-8">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-purple-500/20 pb-4 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-white">Judging <span class="text-purple-400">Matrix</span></h1>
        <p class="text-sm text-purple-300/70">Evaluate technical complexity and innovation</p>
      </div>
      <div class="flex gap-3">
        <a href="/admin.html" class="bg-purple-500/10 border border-purple-500/50 text-purple-400 hover:bg-purple-500/30 font-bold px-4 py-2 rounded-lg text-xs transition">Dashboard</a>
      </div>
    </div>

    <!-- Leaderboard Section -->
    <div class="bg-black/40 border border-[#FFD700]/30 rounded-2xl p-6 shadow-2xl">
      <h2 class="text-xl font-bold text-[#FFD700] mb-4 flex items-center gap-2">🏆 Live Leaderboard</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="bg-[#FFD700]/10 text-[#FFD700] uppercase">
            <tr>
              <th class="p-3 rounded-tl-lg">Rank</th>
              <th class="p-3">Team Name</th>
              <th class="p-3 text-center">Tech</th>
              <th class="p-3 text-center">Innovation</th>
              <th class="p-3 text-center rounded-tr-lg">Total Score</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-[#FFD700]/20">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Scoring Matrix Section -->
    <h2 class="text-xl font-bold text-white mt-10">Pending Evaluations</h2>
    <div class="bg-black/40 border border-purple-500/30 rounded-2xl p-6 shadow-2xl">
      <div class="grid grid-cols-1 gap-4" id="scoringContainer">
        <!-- Populated dynamically -->
      </div>
    </div>

  </div>

  <script>
    const token = () => localStorage.getItem('qryvon_admin_token');
    let groupedTeamsMap = new Map();

    function checkAuth() {
      if (!token()) {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('judgingScreen').classList.add('hidden');
      } else {
        loadData();
      }
    }

    async function loadData() {
      const res = await fetch('/api/admin/data', { headers: { 'Authorization': `Bearer ${token()}` } });
      if (res.status === 401) {
        localStorage.removeItem('qryvon_admin_token');
        return checkAuth();
      }
      const data = await res.json();
      
      // Filter for active, checked-in participants
      const activeAttendees = data.attendees.filter(a => a.checked_in === 1 && a.status !== 'CANCELLED');
      
      // Group participants by Team Name
      groupedTeamsMap = new Map();
      activeAttendees.forEach(a => {
        let key = a.team_size === 'solo' ? `SOLO_${a.ticket_id}` : `TEAM_${(a.team_name || 'Unnamed').trim().toLowerCase()}`;
        
        if (!groupedTeamsMap.has(key)) {
          groupedTeamsMap.set(key, {
            teamKey: key,
            teamName: a.team_size === 'solo' ? a.full_name : (a.team_name || 'Unnamed Team'),
            isSolo: a.team_size === 'solo',
            ticket_ids: [],
            members: [],
            score_tech: a.score_tech,
            score_innovation: a.score_innovation,
            total_score: a.total_score,
            is_judged: a.is_judged,
            github_link: a.github_link,
            itchio_link: a.itchio_link
          });
        }
        
        let team = groupedTeamsMap.get(key);
        team.ticket_ids.push(a.ticket_id);
        team.members.push({ name: a.full_name, email: a.email, ticket: a.ticket_id });
        
        // Grab links if any member provided them
        if (a.github_link) team.github_link = a.github_link;
        if (a.itchio_link) team.itchio_link = a.itchio_link;
        // If one member is marked judged, the team is judged
        if (a.is_judged === 1) team.is_judged = 1;
      });

      renderMatrix();
    }

    async function submitScore(teamKey) {
      const team = groupedTeamsMap.get(teamKey);
      const techInput = document.getElementById(`tech_${teamKey}`).value;
      const innInput = document.getElementById(`inn_${teamKey}`).value;
      
      const tech = parseInt(techInput) || 0;
      const innovation = parseInt(innInput) || 0;

      if (tech < 0 || tech > 10 || innovation < 0 || innovation > 10) {
        alert("Scores must be between 0 and 10.");
        return;
      }

      const btn = document.getElementById(`btn_${teamKey}`);
      btn.textContent = "Saving...";

      // Send the entire array of ticket IDs to update all team members at once
      const res = await fetch('/api/admin/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` },
        body: JSON.stringify({ ticket_ids: team.ticket_ids, tech, innovation })
      });

      if (res.ok) loadData();
      else alert('Failed to save score.');
    }

    function renderMatrix() {
      const allTeams = Array.from(groupedTeamsMap.values());
      const judgedTeams = allTeams.filter(t => t.is_judged === 1).sort((a, b) => b.total_score - a.total_score);
      const pendingTeams = allTeams.filter(t => t.is_judged !== 1);

      // Render Leaderboard
      const lbBody = document.getElementById('leaderboardBody');
      if (judgedTeams.length === 0) {
        lbBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-[#FFD700]/50 italic">No teams have been scored yet.</td></tr>`;
      } else {
        lbBody.innerHTML = judgedTeams.map((team, index) => {
          const memberNames = team.members.map(m => m.name).join(' • ');
          return `
            <tr class="hover:bg-white/5 transition-colors">
              <td class="p-3 font-black text-lg ${index === 0 ? 'text-[#FFD700]' : (index === 1 ? 'text-slate-300' : (index === 2 ? 'text-amber-600' : 'text-white'))}">#${index + 1}</td>
              <td class="p-3 font-bold text-white">
                ${team.teamName} 
                <div class="text-purple-300/50 font-normal text-[10px] mt-1">${memberNames}</div>
              </td>
              <td class="p-3 text-center text-purple-300 font-mono">${team.score_tech}/10</td>
              <td class="p-3 text-center text-purple-300 font-mono">${team.score_innovation}/10</td>
              <td class="p-3 text-center font-black text-[#FFD700] text-lg">${team.total_score}</td>
            </tr>
          `;
        }).join('');
      }

      // Render Scoring Cards
      const container = document.getElementById('scoringContainer');
      if (pendingTeams.length === 0) {
        container.innerHTML = `<div class="text-center p-10 text-purple-300/50">All checked-in teams have been scored!</div>`;
        return;
      }

      container.innerHTML = pendingTeams.map(team => {
        const githubBadge = team.github_link ? `<a href="${team.github_link}" target="_blank" class="bg-slate-800 text-sky-400 border border-slate-700 px-3 py-1.5 rounded-lg text-[10px] hover:bg-slate-700 font-bold transition">GitHub ↗</a>` : `<span class="text-[10px] text-slate-500 italic mt-1">No GitHub</span>`;
        const itchBadge = team.itchio_link ? `<a href="${team.itchio_link}" target="_blank" class="bg-slate-800 text-red-400 border border-slate-700 px-3 py-1.5 rounded-lg text-[10px] hover:bg-slate-700 font-bold transition">Itch.io ↗</a>` : `<span class="text-[10px] text-slate-500 italic mt-1">No Itch</span>`;
        
        // Build the roster list to show underneath the team name
        const rosterHtml = team.members.map(m => `
          <div class="text-[11px] text-slate-300 mb-0.5">
            <span class="font-bold text-white">${m.name}</span> <span class="text-purple-300/70">(${m.email})</span> <span class="text-purple-500/50 ml-1">[${m.ticket}]</span>
          </div>
        `).join('');

        return `
          <div class="bg-black/60 border border-purple-500/20 p-5 rounded-xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h3 class="text-xl font-bold text-white uppercase tracking-wider">${team.teamName}</h3>
                <span class="bg-purple-900/40 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded text-[10px] font-bold">${team.isSolo ? 'Solo' : 'Team'}</span>
              </div>
              
              <div class="bg-black/40 border border-white/5 p-3 rounded-lg mb-3">
                ${rosterHtml}
              </div>

              <div class="flex gap-3 mt-3 items-center">
                ${githubBadge} ${itchBadge}
              </div>
            </div>
            
            <div class="flex flex-wrap lg:flex-nowrap gap-4 w-full lg:w-auto bg-black/40 p-4 rounded-xl border border-white/5">
              <div>
                <label class="block text-[10px] uppercase font-bold text-purple-300 mb-1">Tech (1-10)</label>
                <input type="number" id="tech_${team.teamKey}" min="0" max="10" placeholder="0" class="w-20 bg-black/80 border border-purple-500/50 rounded-lg px-3 py-2 text-white font-black text-center focus:outline-none focus:border-purple-400">
              </div>
              <div>
                <label class="block text-[10px] uppercase font-bold text-purple-300 mb-1">Innovation (1-10)</label>
                <input type="number" id="inn_${team.teamKey}" min="0" max="10" placeholder="0" class="w-20 bg-black/80 border border-purple-500/50 rounded-lg px-3 py-2 text-white font-black text-center focus:outline-none focus:border-purple-400">
              </div>
              <div class="flex items-end">
                <button id="btn_${team.teamKey}" onclick="submitScore('${team.teamKey}')" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-lg text-sm transition h-[42px] shadow-lg">Save Score</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    checkAuth();
  </script>
</body>
</html>
