<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qryvon Sync | Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-qryvon-dark { background-color: #0A1F18; }
    .text-qryvon-lavender { color: #C4B5FD; }
    .bg-qryvon-gold { background-color: #FFD700; }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator, input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  </style>
</head>
<body class="bg-qryvon-dark text-slate-100 min-h-screen font-sans">

  <div id="loginScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-qryvon-dark px-4">
    <div class="w-full max-w-sm bg-black/40 border border-[#C4B5FD]/30 p-8 rounded-2xl shadow-2xl backdrop-blur-md">
      <div class="text-center mb-6"><h1 class="text-2xl font-bold text-white">ADMIN <span class="text-[#FFD700]">PORTAL</span></h1><p class="text-[#C4B5FD] text-xs mt-1">Qryvon Sync '26</p></div>
      <form id="loginForm" class="space-y-4">
        <div><label class="block text-xs font-medium text-[#C4B5FD] mb-1">Email</label><input type="email" id="adminEmail" required class="w-full bg-black/50 border border-[#C4B5FD]/50 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FFD700]"/></div>
        <div><label class="block text-xs font-medium text-[#C4B5FD] mb-1">Password</label><input type="password" id="adminPass" required class="w-full bg-black/50 border border-[#C4B5FD]/50 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FFD700]"/></div>
        <div id="loginErr" class="text-xs text-red-400 hidden text-center"></div>
        <button type="submit" class="w-full bg-[#FFD700] text-[#0A1F18] font-bold py-2.5 rounded-lg text-sm mt-2 hover:bg-yellow-500 transition">Login</button>
      </form>
    </div>
  </div>

  <div id="dashboardScreen" class="hidden p-6 max-w-[1400px] mx-auto space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-[#C4B5FD]/20 pb-4 gap-4">
      <div><h1 class="text-3xl font-bold text-white">Qryvon Sync <span class="text-[#FFD700]">'26</span></h1><p class="text-sm text-[#C4B5FD]">Operations Dashboard</p></div>
      <div class="flex flex-wrap gap-3">
        <a href="/scanner.html" target="_blank" class="bg-[#FFD700]/10 border border-[#FFD700] text-[#FFD700] hover:bg-[#FFD700]/30 font-bold px-4 py-2 rounded-lg text-xs transition flex items-center">📷 Launch Scanner</a>
        <button onclick="loadData()" class="bg-[#C4B5FD]/20 border border-[#C4B5FD] text-[#C4B5FD] hover:bg-[#C4B5FD]/40 font-bold px-4 py-2 rounded-lg text-xs transition">🔄 Refresh</button>
        <button onclick="logout()" class="bg-red-950 border border-red-500 text-red-400 hover:bg-red-900 font-bold px-4 py-2 rounded-lg text-xs transition">Logout</button>
      </div>
    </div>

    <!-- Live Event Settings Panel -->
    <div class="bg-black/40 border border-[#FFD700]/40 p-4 rounded-xl shadow-lg flex flex-col md:flex-row gap-4 items-center justify-between">
      <div>
        <h2 class="text-sm font-bold text-[#FFD700]">Live Event Settings</h2>
        <p class="text-[10px] text-[#C4B5FD]">Update dates dynamically without changing code.</p>
      </div>
      <div class="flex flex-wrap gap-4 items-end">
        <div>
          <label class="block text-[10px] uppercase font-bold text-[#C4B5FD] mb-1">Registration Closes</label>
          <input type="datetime-local" id="setRegDeadline" class="bg-black border border-[#C4B5FD]/50 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-[#FFD700]"/>
        </div>
        <div>
          <label class="block text-[10px] uppercase font-bold text-[#C4B5FD] mb-1">Gate Scanner Active On</label>
          <input type="date" id="setScanDate" class="bg-black border border-[#C4B5FD]/50 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-[#FFD700]"/>
        </div>
        <button onclick="saveSettings()" class="bg-[#FFD700] text-[#0A1F18] font-bold px-4 py-1.5 rounded text-xs hover:bg-yellow-500">Save Changes</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-black/30 p-5 rounded-xl border border-[#C4B5FD]/30 shadow-lg"><p class="text-xs font-semibold text-[#C4B5FD] uppercase">Registered</p><p id="totalStat" class="text-4xl font-black mt-2 text-white">0</p></div>
      <div class="bg-black/30 p-5 rounded-xl border border-emerald-500/30 shadow-lg"><p class="text-xs font-semibold text-emerald-400 uppercase">Checked In</p><p id="checkedStat" class="text-4xl font-black mt-2 text-emerald-400">0</p></div>
      <div class="bg-black/30 p-5 rounded-xl border border-amber-500/30 shadow-lg"><p class="text-xs font-semibold text-amber-400 uppercase">Pending</p><p id="pendingStat" class="text-4xl font-black mt-2 text-amber-400">0</p></div>
    </div>

    <div class="bg-black/40 border border-[#C4B5FD]/30 rounded-xl overflow-x-auto shadow-2xl">
      <table class="w-full text-left text-xs whitespace-nowrap">
        <thead class="bg-[#C4B5FD]/10 text-[#C4B5FD] uppercase"><tr><th class="p-4">Ticket</th><th class="p-4">Participant</th><th class="p-4">Contact</th><th class="p-4">Team</th><th class="p-4">Status</th></tr></thead>
        <tbody id="tableBody" class="divide-y divide-[#C4B5FD]/20"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = () => localStorage.getItem('qryvon_admin_token');
    
    function checkAuth() {
      if (token()) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('dashboardScreen').classList.remove('hidden'); loadData(); loadSettings(); } 
      else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('dashboardScreen').classList.add('hidden'); }
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('adminEmail').value, password: document.getElementById('adminPass').value }) });
      const data = await res.json();
      if (res.ok) { localStorage.setItem('qryvon_admin_token', data.token); checkAuth(); } 
      else { document.getElementById('loginErr').textContent = data.error; document.getElementById('loginErr').classList.remove('hidden'); }
    };

    function logout() { localStorage.removeItem('qryvon_admin_token'); checkAuth(); }

    async function loadSettings() {
      const res = await fetch('/api/settings');
      const data = await res.json();
      document.getElementById('setRegDeadline').value = data.reg_deadline;
      document.getElementById('setScanDate').value = data.scan_date;
    }

    async function saveSettings() {
      const reg_deadline = document.getElementById('setRegDeadline').value;
      const scan_date = document.getElementById('setScanDate').value;
      await fetch('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` }, body: JSON.stringify({ reg_deadline, scan_date }) });
      alert("Settings Updated! System is live with new dates.");
    }

    async function loadData() {
      const res = await fetch('/api/admin/data', { headers: { 'Authorization': `Bearer ${token()}` } });
      if (res.status === 401) return logout();
      const data = await res.json();
      document.getElementById('totalStat').textContent = data.total; document.getElementById('checkedStat').textContent = data.checkedIn; document.getElementById('pendingStat').textContent = data.pending;
      document.getElementById('tableBody').innerHTML = data.attendees.map(a => `
        <tr class="hover:bg-white/5 transition-colors">
          <td class="p-4 font-mono font-bold text-[#FFD700]">${a.ticket_id}</td>
          <td class="p-4"><div class="font-bold text-white text-sm">${a.full_name}</div><div class="text-[#C4B5FD]/70">DOB: ${a.dob}</div></td>
          <td class="p-4"><div class="text-white">${a.email}</div><div class="text-[#C4B5FD]/70">${a.phone}</div><div class="text-[#C4B5FD]/70 text-[10px] uppercase mt-0.5">${a.institution}</div></td>
          <td class="p-4"><div class="text-white font-semibold">${a.team_size === 'solo' ? 'Solo' : a.team_name} <span class="text-[#C4B5FD]/50 font-normal">(${a.team_size})</span></div>${a.member2_name ? `<div class="text-[#C4B5FD]/70 text-[10px]">2: ${a.member2_name}</div>` : ''}${a.member3_name ? `<div class="text-[#C4B5FD]/70 text-[10px]">3: ${a.member3_name}</div>` : ''}</td>
          <td class="p-4"><div class="inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ${a.checked_in ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-amber-500/10 text-amber-500 border border-amber-500/30'}">${a.checked_in ? '✅ CHECKED IN' : '⏳ PENDING'}</div>${a.checked_in_at ? `<div class="text-[#C4B5FD]/50 text-[10px] mt-1">${a.checked_in_at}</div>` : ''}</td>
        </tr>
      `).join('');
      // Example helper for rendering clickable links inside your row/modal:
const githubBadge = a.github_link 
  ? `<a href="${a.github_link}" target="_blank" class="text-xs bg-slate-800 text-sky-400 border border-slate-700 px-2 py-1 rounded hover:bg-slate-700">GitHub ↗</a>` 
  : `<span class="text-xs text-slate-500">No GitHub</span>`;

const itchBadge = a.itchio_link 
  ? `<a href="${a.itchio_link}" target="_blank" class="text-xs bg-slate-800 text-red-400 border border-slate-700 px-2 py-1 rounded hover:bg-slate-700">Itch.io ↗</a>` 
  : `<span class="text-xs text-slate-500">No Itch</span>`;
    }
    checkAuth();
  </script>
</body>
</html>
